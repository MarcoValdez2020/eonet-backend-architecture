# Un Role de IAM = una identidad que algo (no una persona) puede ASUMIR
# temporalmente para actuar en AWS. No tiene usuario/contrasena: se obtiene
# via "sts:AssumeRole" y AWS entrega credenciales de corta duracion.
#
# Cada Role tiene dos partes:
#   - AssumeRolePolicyDocument ("trust policy"): QUIEN puede asumir este rol.
#     Aqui: solo el servicio Lambda (lambda.amazonaws.com).
#   - Policies: QUE puede hacer una vez que lo asumio (permisos reales).
#
# Minimo privilegio: cada funcion tiene SU PROPIO rol, con solo lo que
# necesita para su trabajo -- nunca un rol generico compartido con permisos
# de mas.
Resources:
  ExtractLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      # Managed policy de AWS para poder escribir logs en CloudWatch
      # (CreateLogGroup/CreateLogStream/PutLogEvents). Sin esto la Lambda
      # corre pero no queda ningun log en CloudWatch para depurar.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ExtractWriteRawPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                # DataBucket.Arn se resuelve porque este archivo se fusiona
                # con infra/s3.yml en el MISMO Stack (ver serverless.yml).
                # Restringido al prefijo raw/ -- ni siquiera puede tocar
                # curated/ u otras carpetas del mismo bucket.
                Resource: !Sub ${DataBucket.Arn}/raw/*

  CurateLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CurateReadRawWriteCuratedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${DataBucket.Arn}/raw/*
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${DataBucket.Arn}/curated/*
              # Permisos de SQS para que el Event Source Mapping pueda hacer
              # polling de la cola y borrar mensajes procesados. Con un role
              # PROPIO (no el generico que Serverless crearia por default),
              # estos permisos NO se agregan solos -- hay que declararlos.
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt CurateQueue.Arn

  # generateRanges (backfill) solo calcula fechas -- no lee ni escribe nada
  # en S3/SQS/etc, asi que su Role no necesita ninguna Policy propia mas
  # alla de poder escribir logs.
  GenerateRangesLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # Role que asume el STATE MACHINE (no una Lambda) -- por eso el Principal
  # de la trust policy es "states.amazonaws.com", no "lambda.amazonaws.com".
  # Minimo privilegio: solo puede invocar las dos Lambdas que orquesta el
  # backfill (extract y generateRanges), nada mas.
  BackfillStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BackfillInvokeLambdasPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt ExtractLambdaFunction.Arn
                  - !GetAtt GenerateRangesLambdaFunction.Arn

  # GET /events -- consulta Athena. Nota importante de como funciona esto:
  # Athena corre la consulta CON LA IDENTIDAD de quien la lanza (esta
  # Lambda), no con un role propio de servicio -- por eso este Role
  # necesita permisos de Glue (leer el catalogo) y de S3 sobre curated/
  # (los Parquet reales) y athena-results/ (donde Athena escribe cada
  # resultado), ademas de los de athena:* sobre el WorkGroup.
  EventsApiLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EventsQueryAthenaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:StopQueryExecution
                Resource: !Sub arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${EonetAthenaWorkGroup}
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetPartitions
                Resource:
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${EonetGlueDatabase}
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${EonetGlueDatabase}/curated_events
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${DataBucket.Arn}/curated/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${DataBucket.Arn}/athena-results/*
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !GetAtt DataBucket.Arn