# service = el nombre que agrupa TODOS los recursos de este proyecto.
# CloudFormation crea un "Stack" (grupo de recursos que se crean/actualizan/
# borran juntos) llamado "<service>-<stage>", ej: ammper-eonet-platform-dev.
service: ammper-eonet-platform

frameworkVersion: '4'

provider:
  name: aws
  # Lambda no soporta python3.14 todavía (la versión que usas en local para
  # main.py). Usamos la última que sí soporta Lambda como "managed runtime".
  runtime: python3.13
  region: us-east-1
  # "stage" = ambiente (dev/prod/...). Se puede cambiar al desplegar:
  #   serverless deploy --stage prod
  # Mismo código, mismo YAML, pero una copia de infraestructura DISTINTA
  # (otro Stack de CloudFormation) por cada stage. Por defecto usamos "dev".
  stage: ${opt:stage, 'dev'}
  # "profile" = qué juego de credenciales de ~/.aws/credentials usar (por
  # nombre), en vez del perfil [default] (que en esta laptop es la cuenta
  # del trabajo). Este proyecto SIEMPRE despliega con el perfil "personal"
  # — así nunca corre nada por accidente contra la cuenta de la empresa.
  # Se puede pisar puntualmente con: serverless deploy --aws-profile otro
  profile: personal
  # Imagenes de contenedor (ECR) para funciones cuyas dependencias no caben
  # en el limite de 250MB descomprimido de un zip/layer normal de Lambda.
  # "curate" (polars + reverse_geocoder, que arrastra numpy/scipy) pesa
  # 367-434MB medido localmente -- no cabe en zip. Serverless Framework crea
  # el repositorio ECR, construye la imagen con el Dockerfile de la carpeta
  # indicada y la sube en cada deploy.
  ecr:
    images:
      curateImage:
        path: functions/ingest/curate
        platform: linux/arm64
  # NOTA: cualquier comando de Serverless imprime un warning cosmetico
  # "[!] Invalid configuration encountered / at 'functions.curate.image':
  # unsupported string format" -- confirmado que NO bloquea nada (el
  # deploy real funciona, la imagen se resuelve bien a un ImageUri real).
  # Es un falso positivo del validador de config de la CLI con esta forma
  # de referenciar provider.ecr.images por nombre. Ignorar.

# "individually: true" = cada funcion se empaqueta en su propio .zip, con
# SOLO las dependencias declaradas en el requirements.txt de su carpeta.
# Sin esto, todas las funciones compartirian un unico paquete gigante con
# la union de todas las dependencias (justo lo que queriamos evitar al
# darle a cada Lambda su propio requirements.txt).
package:
  individually: true

# Config de empaquetado de dependencias Python (integrado en el framework
# desde v4 -- basta con que exista este bloque "custom.pythonRequirements"
# para que se active, sin declarar ningun plugin).
custom:
  pythonRequirements:
    # Esto solo aplica a funciones de ZIP (como extract). httpx (su unica
    # dependencia externa) es 100% Python puro, sin extensiones compiladas
    # en C, asi que el wheel que baja pip en tu Mac funciona igual en Lambda
    # (Linux) -- no hace falta dockerizePip para extract. `curate` NO usa
    # este mecanismo en absoluto: sus dependencias (polars, reverse_geocoder)
    # pesan demasiado para un zip/layer (250MB limite) y se empaquetan como
    # imagen de contenedor (provider.ecr.images.curateImage arriba), donde
    # el Dockerfile mismo ya construye contra Linux/arm64 directamente.
    dockerizePip: false

# Cada archivo de infra/ declara un pedazo de CloudFormation (Resources: {...}).
# Serverless Framework los fusiona en una sola plantilla al desplegar — por
# eso pueden referenciarse entre sí con !Ref / !GetAtt sin necesidad de
# exports/imports (eso solo hace falta entre STACKS distintos, y aquí
# deliberadamente usamos uno solo — ver plan de arquitectura).
resources:
  - ${file(infra/s3.yml)}
  - ${file(infra/messaging.yml)}
  - ${file(infra/stepfunctions.yml)}
  - ${file(infra/glue.yml)}
  - ${file(infra/cognito.yml)}
  - ${file(iam/roles.yml)}
  # Los iremos sumando a medida que los llenemos:
  # - ${file(infra/dynamodb.yml)}

functions:
  extract:
    # "module" le dice al empaquetador de Python EN QUE CARPETA buscar el
    # requirements.txt de esta funcion (y desde donde se instalan sus
    # dependencias). Por eso "handler" ya no lleva la ruta completa desde
    # la raiz del repo, sino relativa a ese "module".
    module: functions/ingest/extract
    handler: handler.handler
    # Referenciar un Role por su Logical ID (definido en iam/roles.yml):
    # Serverless Framework resuelve esto a un !GetAtt ExtractLambdaRole.Arn
    # por debajo. Si NO se pusiera "role", el framework generaria uno
    # automatico (mas generico) -- preferimos el nuestro, de minimo privilegio.
    role: ExtractLambdaRole
    # Default de Lambda es 6s de timeout -- insuficiente con reintentos y
    # backoff de red. 120s da margen de sobra para una ventana chica.
    timeout: 120
    memorySize: 256
    environment:
      BUCKET_NAME: !Ref DataBucket
    events:
      - schedule:
          # cron diario de ingesta incremental. Ya se probo a mano con un
          # invoke manual (trajo eventos reales de EONET); activado.
          rate: rate(1 day)
          enabled: true

  curate:
    # Funcion de IMAGEN (no zip): ver provider.ecr.images.curateImage arriba.
    # "custom.pythonRequirements" (mas abajo) no aplica a esta funcion --
    # esa config solo rige el empaquetado por zip de funciones normales.
    image: curateImage
    role: CurateLambdaRole
    architecture: arm64
    # Timeout mayor que extract: por invocacion puede traer miles de eventos
    # de un solo objeto raw, explotarlos, geocodificar cada fila valida y
    # escribir varias particiones Parquet.
    timeout: 300
    memorySize: 1024
    environment:
      BUCKET_NAME: !Ref DataBucket
      OFFSHORE_THRESHOLD_KM: "100"
    events:
      - sqs:
          arn: !GetAtt CurateQueue.Arn
          # batchSize 1 a proposito: cada objeto raw ya puede traer miles de
          # eventos por si solo (limit=10000 en extract) -- agrupar varios
          # objetos S3 distintos en una sola invocacion solo mezclaria fallos
          # de archivos no relacionados sin ningun beneficio real.
          batchSize: 1
          # Permite que, si UN mensaje del batch falla, solo ESE mensaje
          # vuelva a la cola (para reintento/DLQ) sin reprocesar mensajes que
          # ya se hayan escrito correctamente a curated/.
          functionResponseType: ReportBatchItemFailures

  generateRanges:
    # Primer paso del backfill (stepfunctions/backfill.asl.json): calcula los
    # ~60 rangos mensuales de los ultimos 5 anios. Solo la invoca el state
    # machine (Task) -- no tiene "events", nunca dispara sola.
    module: functions/ingest/backfill
    handler: generate_ranges.handler
    role: GenerateRangesLambdaRole
    timeout: 10
    memorySize: 128
